[package]
name = "kiro-cli-common"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Shared command-line parameter groups, exit model and report routing for kiro tools"

[dependencies]
kiro-core = { path = "../kiro-core" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
