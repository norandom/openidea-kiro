schema_version = "2"

[topics.ops]
label = "Operations"
description = "System operations and telemetry."

[topics.pm]
label = "Project Management"
description = "Project planning and delivery."

[topics.hr]
label = "Human Resources"
description = "Staffing and shifts."

[topics.wide]
label = "Wide Topic"
description = "Topic with 65 enum terms for cap testing."

[terms.mode]
topic = "ops"
label = "Mode"
definition = "The operating mode of the controller."
kind = "enum"
values = ["normal", "safe", "maintenance"]

[terms.depth]
