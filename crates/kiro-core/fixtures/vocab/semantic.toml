schema_version = "1"

[topics.empty]
label = "Empty Topic"

[topics.sdd]
label = "SDD"

[topics.pm]
label = "PM"

[terms.t-no-def]
topic = "sdd"
label = "No Def"
definition = ""

[terms.t-bad-kind]
topic = "sdd"
label = "Bad Kind"
definition = "A term with invalid kind."
kind = "custom"

[terms.t-first-label]
topic = "sdd"
label = "Same Label"
definition = "First term with this label."

[terms.t-dup-label]
topic = "sdd"
label = "Same Label"
definition = "Second term with duplicate label."

[terms.t-broader-unknown]
topic = "sdd"
label = "Broader Unknown"
definition = "Broader unknown."
broader = ["ghost"]

[terms.t-broader-cross]
topic = "sdd"
label = "Broader Cross"
definition = "Broader cross topic."
broader = ["pm-term"]

[terms.t-dep-no-rep]
topic = "sdd"
label = "Dep No Rep"
definition = "Deprecated without replacement."
deprecated = true

[terms.t-rep-unknown]
topic = "sdd"
label = "Rep Unknown"
definition = "Replaced by unknown."
deprecated = true
replaced_by = "ghost"

[terms.t-rep-cross]
topic = "sdd"
label = "Rep Cross"
definition = "Replaced by cross topic."
deprecated = true
replaced_by = "pm-term"

[terms.pm-term]
topic = "pm"
label = "PM Term"
definition = "A term in PM topic."
