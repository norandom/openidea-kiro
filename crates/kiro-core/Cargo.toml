[package]
name = "kiro-core"
version = "1.0.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
biodivine-lib-bdd = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }
winnow = "0.7"

[dev-dependencies]
insta = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
