[package]
name = "kiro-code"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Native code measurement for the kiro code gate: metrics over a library-produced syntax tree"

[dependencies]
kiro-core = { path = "../kiro-core" }
# Parse layer adopted in G1 (code-constraints research.md, 2026-11-10). One
# tree-sitter runtime for every analyzer; no lexer or parser is written here.
ast-grep-core = "=0.51.1"
ast-grep-language = { version = "=0.51.1", default-features = false, features = [
    "tree-sitter-rust",
    "tree-sitter-python",
    "tree-sitter-typescript",
    "tree-sitter-javascript",
] }
# Already in the tree through ast-grep-language; honors .gitignore in the walk.
ignore = "0.4.34"

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
