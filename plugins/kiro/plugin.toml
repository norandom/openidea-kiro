id = "kiro"
name = "Kiro"
version = "0.1.0"
description = "Spec-driven development in OpenIDEA: discovery, navigation, visualization, vocabulary and quality checks."
authors = ["The OpenIDEA Authors"]
openidea-api = "0.1"
wasm = "dist/plugin.wasm"
permissions = ["project-read", "editor-read", "editor-write"]

